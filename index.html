    <meta name="theme-color" content="#f4f5f7" />
    <!-- Page-level force-dark opt-out: "only light" tells Android browsers
         (Chrome auto-dark, Samsung Internet dark mode) to NEVER invert this
         page — the app manages its own dark theme. The pre-paint script and
         useTheme flip this meta to "dark" whenever the dark theme is active. -->
    <meta name="color-scheme" content="only light" />
    <!-- Dark-support signal for Samsung Internet's force-dark heuristic (it
         scans for a prefers-color-scheme dark rule) + pre-CSS dark fallback. -->
    <style>
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) { color-scheme: dark; background: #0f131a; }
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Pre-paint theme: stored choice first, else the OS dark-mode setting.
         Keeps the installed app (TWA) from flashing white on dark phones; the
         React useTheme hook takes over after mount with the same logic. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('24h-circle-planner.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'dark') {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#0f131a');
            var cs = document.querySelector('meta[name="color-scheme"]');
            if (cs) cs.setAttribute('content', 'dark');
          }
        } catch (e) { /* default light */ }
      })();
    </script>
