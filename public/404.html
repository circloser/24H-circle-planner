<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <meta name="color-scheme" content="light dark" />
  <title>페이지를 찾을 수 없습니다 | 24Houring</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #172033; }
    main { box-sizing: border-box; width: min(92vw, 620px); padding: 42px 28px; border: 1px solid #dbe2ea; border-radius: 20px; background: #fff; box-shadow: 0 18px 45px rgb(15 23 42 / 8%); }
    p { line-height: 1.65; color: #526071; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
    a { min-height: 44px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 10px; background: #254cdd; color: #fff; text-decoration: none; font-weight: 700; }
    a.secondary { background: #edf2ff; color: #18389c; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #f8fafc; }
      main { background: #172033; border-color: #334155; box-shadow: none; }
      p { color: #cbd5e1; }
      a.secondary { background: #293757; color: #dbeafe; }
    }
  </style>
</head>
<body>
  <main>
    <p>404</p>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 입력한 주소가 정확하지 않을 수 있습니다. 아래에서 원하는 페이지로 이동해 주세요.</p>
    <p lang="en">The page may have moved, or the address may be incorrect. Choose a destination below.</p>
    <nav aria-label="주요 페이지">
      <a href="/">플래너 홈</a>
      <a class="secondary" href="/guides/">가이드</a>
      <a class="secondary" href="/blog/">블로그</a>
      <a class="secondary" href="/contact">문의</a>
    </nav>
  </main>
</body>
</html>
